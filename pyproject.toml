[project]
name = "agentic-chatbot"
version = "0.1.0"
description = "Agentic Chatbot UI for AWS Bedrock AgentCore"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "starlette>=0.36.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "psycopg2-binary>=2.9.9",
    "bedrock-agentcore>=1.25.0",
    "langgraph>=1.0.0",
]

[tool.agentcore]
entrypoint = "runtime_entrypoint.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
